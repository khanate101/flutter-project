name: Extract Flutter project

on:
  push:
    paths:
      - 'StatusVault_Android_Web_fixed_v3.zip'
      - '.github/workflows/extract-project.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Flutter project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/flutter_project
          mkdir -p /tmp/flutter_project
          unzip -q StatusVault_Android_Web_fixed_v3.zip -d /tmp/flutter_project

          # The ZIP contains the Flutter project at its root.
          rsync -a /tmp/flutter_project/ ./

          # Remove generated/local-only files from the archive.
          rm -rf macos/Flutter/ephemeral
          rm -f .flutter-plugins-dependencies
          rm -rf .dart_tool build
          rm -f StatusVault_Android_Web_fixed_v3.zip
          rm -f github_write_test.txt

      - name: Commit extracted Flutter project
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add Flutter project files"
          git push
