name: status_vault
description: StatusVault - WhatsApp status organizer with privacy-first local storage.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  share_plus: ^11.0.0
  video_player: ^2.10.0
  photo_manager: ^3.7.1
  intl: ^0.20.2
  path: ^1.9.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  generate: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.png

flutter_native_splash:
  color: "#0B1020"
  image: assets/splash.png
  android_12:
    color: "#0B1020"
    image: assets/splash.png
